aid: jobtoday
name: JobToday
description: 'JobToday is a mobile-first hiring marketplace that connects job seekers
  directly with employers for fast, chat-based hiring, primarily across service industries
  such as hospitality, retail, and customer service. Founded in 2015 and headquartered
  in Luxembourg (JobToday S.A.), the app lets employers post jobs and message candidates
  directly, with the company reporting that roughly 70% of matches happen within 24
  hours. JobToday operates across 20+ countries including the UK, US, Spain, Mexico,
  and France, and reports tens of millions of job seekers and hundreds of thousands
  of hiring businesses. It is backed by Accel. JobToday is a consumer mobile product
  and does not publish a public developer API.'
